# Configuration d'Alembic, l'outil de migrations.
# L'adresse de la base n'est PAS ici : alembic/env.py la lit dans les
# réglages de l'API, pour qu'elle n'existe qu'à un seul endroit.

[alembic]
script_location = alembic
# Ajoute le dossier courant (/code dans le conteneur) aux chemins où Python
# cherche les modules : sans ça, « import app » échoue dans env.py, car la
# commande alembic vit dans /usr/local/bin, loin de notre code.
prepend_sys_path = .
# Les fichiers de migration se nomment « 0001_…py », « 0002_…py » : leur
# ordre se lit directement dans l'explorateur.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
