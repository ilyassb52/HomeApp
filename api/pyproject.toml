[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F : les erreurs de base ; I : l'ordre des imports ; UP : la syntaxe
# Python moderne (str | None plutôt que Optional[str]).
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Notre dossier alembic/ porte le même nom que la bibliothèque : sans cette
# ligne, ruff croirait que « from alembic import ... » vise notre code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
